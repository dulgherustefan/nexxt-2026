# Două zone = două containere, două volume de date. Între ele trece doar dioda (HTTP semnat HMAC).
# Generarea e deterministă (seed 7), deci fiecare container își face singur lumea și își păstrează
# DOAR baza zonei lui. Singurul volum comun conține hash-urile canary (fără conținut AML).
# Cheia Bedrock vine din mediul gazdei la rulare: AWS_BEARER_TOKEN_BEDROCK (nu din imagine, nu din fișier).
x-common: &common
  build: .
  image: versoml:latest
  environment: &env
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    VERSOML_LLM_MODE: ${VERSOML_LLM_MODE:-auto}
    VERSOML_OSINT_MODE: ${VERSOML_OSINT_MODE:-auto}
    SERPER_API_KEY: ${SERPER_API_KEY:-}
    VERSOML_DIODE_SECRET: ${VERSOML_DIODE_SECRET:-schimba-ma-in-productie}
    VERSOML_CLIENT_URL: http://client:8000
    VERSOML_AML_URL: http://aml:8001

services:
  client:
    <<: *common
    command: ["sh", "-c", "uv run --no-dev versoml seed && rm -f var/aml_zone.db && uv run --no-dev versoml train && exec uv run --no-dev uvicorn versoml.zone_client.app:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes: [client-data:/app/var, wall-registry:/app/var/wall]

  aml:
    <<: *common
    command: ["sh", "-c", "uv run --no-dev versoml seed && rm -f var/client_zone.db && uv run --no-dev versoml train && exec uv run --no-dev uvicorn versoml.zone_aml.app:app --host 0.0.0.0 --port 8001"]
    ports: ["8001:8001"]
    volumes: [aml-data:/app/var, wall-registry:/app/var/wall]

volumes:
  client-data:
  aml-data:
  wall-registry:
