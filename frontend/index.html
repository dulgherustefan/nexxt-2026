<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // pick the theme before first paint: a saved choice, else the system setting
      (function () {
        var t;
        try { t = localStorage.getItem("versoml-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0d0e10" : "#ffffff";
      })();
    </script>
    <meta name="description" content="VersoML refunds disputed payments by the next business day, builds the evidence file and drafts the chargeback. A demo on synthetic data." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VersoML</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
