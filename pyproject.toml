[project]
name = "versoml"
version = "0.1.0"
description = "VersoML: contestații de plată rezolvate la T+1, pistă AML pornită din contestație, zid anti-tipping-off testat."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # LLM: Claude pe Amazon Bedrock (endpoint-ul Mantle)
  "anthropic[bedrock]>=1.0",
  "boto3>=1.40",
  # API, evenimente, configurare
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "orjson>=3.10",
  "jinja2>=3.1",
  # Orchestrare și tool-uri
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "mcp>=1.20",
  "cedarpy>=4.0",
  "simpleeval>=1.0",
  # Registrul de probe
  "cryptography>=43",
  "segno>=1.6",
  # Date sintetice și ML
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "networkx>=3.3",
  "rapidfuzz>=3.9",
  "faker>=30",
  "holidays>=0.60",
  "python-stdnum>=1.20",
  # OSINT
  "dnspython>=2.6",
  "tldextract>=5.1",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "trafilatura>=1.12",
  "ddgs>=9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "respx>=0.21",
]

[project.scripts]
versoml = "versoml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["versoml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
  "live: apelează servicii externe reale (rulate doar cu VERSOML_LIVE_TESTS=1)",
]
