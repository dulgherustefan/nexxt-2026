# Parametrii motorului de reguli VersoML (docs/06 §4.4). Valorile de mai jos sunt implicite;
# suprascrierile stau în var/rules_params.json (set_params). confidence: U = neverificat, de confirmat
# cu mentorii; S = sursă secundară; P = text oficial. Un parametru `locked` nu se poate schimba.

auto_refund_cap_ron:
  value: 5000
  type: number
  min: 0
  confidence: U
  rules: [DSP-59]
  description: >-
    Cap for automatic refunds, in RON. Above the cap, a human approves the refund, still within the refund
    deadline. docs/context/14 (DSP-59) does not give a value.

client_fraud_signal_threshold:
  value: 0.7
  type: number
  min: 0
  max: 1
  confidence: U
  rules: [URM-03]
  description: >-
    M2 score (customer fraud) at which the case goes to a human. M2 is only a signal.
    It does not withhold or refuse the refund.

prior_disputes_signal_threshold:
  value: 3
  type: integer
  min: 1
  confidence: U
  rules: [URM-03]
  description: "Number of disputes in the last 12 months at which the case goes to a human."

eur_ron_rate:
  value: 5.0
  type: number
  min: 0.0001
  confidence: U
  rules: [PAY-05, DSP-59, AML-07, AML-08]
  description: >-
    EUR/RON exchange rate for the euro caps (EUR 30, EUR 10,000) and for the RON cap.
    5.00 is the dummy test value from docs/context/11 §3.

refund_end_of_day:
  value: "23:59:59"
  type: time
  confidence: U
  rules: [PAY-03, DSP-03]
  description: "Time of “end of day” for the refund deadline. The notes do not define it."

bank_closure_days:
  value: []
  type: date_list
  confidence: U
  rules: [PAY-03, CMP-01, CMP-02]
  description: >-
    Extra days the bank is closed, beyond public holidays (ISO format, for example 2026-12-31).

refund_anchor_mode:
  value: cea_mai_devreme
  type: enum
  choices: [cea_mai_devreme, notificare]
  confidence: U
  rules: [DSP-58]
  description: >-
    Start point of the refund deadline. “cea_mai_devreme” (earliest) uses whichever comes first: the bank
    noting the fraud or the customer reporting it. “notificare” uses the customer's report only. This is
    an inference from art. 173 (“after noting or being notified”).

refund_sla_alert_hours:
  value: 4
  type: integer
  min: 0
  confidence: U
  rules: [DSP-03]
  description: "Hours before the refund deadline when the case becomes “at risk” (DSP_REFUND_SLA_AT_RISK)."

undue_delay_days:
  value: null
  type: integer
  nullable: true
  min: 0
  confidence: U
  rules: [PAY-01]
  description: >-
    Threshold for “without undue delay” (Law 209/2019, art. 169). The notes do not give one; empty means
    not applied. Going over it sends the case to a human. It does not reject or delay the refund.

competent_authority:
  value: null
  type: enum
  nullable: true
  choices: [BNR, ANPC]
  confidence: U
  rules: [PAY-03]
  description: "Authority that receives the art. 173 notice (BNR or ANPC). Not verified."

complaint_alert_lead_business_days:
  value: 2
  type: integer
  min: 0
  confidence: U
  rules: [CMP-01, CMP-02]
  description: >-
    Business days before the 15-business-day deadline when the holding reply alert appears.

default_card_scheme:
  value: visa
  type: enum
  choices: [visa, mastercard]
  confidence: U
  rules: [DSP-52]
  description: "Card scheme assumed when the card data does not state it (Banca Demo cards are Visa)."

visa_other_open_days:
  value: 120
  type: integer
  min: 1
  confidence: U
  rules: [DSP-24]
  description: >-
    Dispute deadline for Visa conditions whose deadline was not read (“120 days for most”).

visa_131_wait_anchor:
  value: processing_date
  type: enum
  choices: [processing_date, transaction_date]
  confidence: U
  rules: [DSP-24]
  description: "Start point of the 15-day wait for Visa 13.1. The notes do not specify it (fixture: processing date)."

fraud_report_deadline_mode:
  value: null
  type: enum
  nullable: true
  choices: [max, after_day_60]
  confidence: U
  rules: [DSP-25]
  description: >-
    How to read the Visa fraud report deadline (60 days from the transaction or 30 days from the report).
    Empty means the engine computes both readings. If they differ, it takes the earlier date and flags it
    to a human.

dispute_count_scope:
  value: toate
  type: enum
  choices: [toate, frauda]
  confidence: U
  rules: [DSP-26]
  description: >-
    Which disputes count toward the limit of 35 in 120 days (Visa 10.4). “toate” counts all disputes;
    “frauda” counts fraud disputes only.

scheme_alert_lead_days:
  value: 5
  type: integer
  min: 0
  confidence: U
  rules: [DSP-23]
  description: "Days before a scheme deadline when the alert appears (5 is the fixture value from docs/context/14 §10)."

mc_chargeback_open_days:
  value: 120
  type: integer
  min: 1
  confidence: S
  rules: [DSP-42]
  description: "Mastercard chargeback deadline (“about 120 days”, from aggregators). Sources conflict."

sct_recall_answer_banking_days:
  value: 15
  type: integer
  min: 1
  confidence: U
  rules: [REC-02]
  description: >-
    Answer deadline for a recall of a non-instant SCT. docs/05 gives 15 banking days only for
    SCT Inst. The SCT value is assumed to be the same.

ron_recall_answer_banking_days:
  value: null
  type: integer
  nullable: true
  min: 1
  confidence: U
  rules: [REC-04]
  description: >-
    Answer deadline for a RON recall (SENT, Plăți Instant). The procedure is not public; empty means no deadline.

recall_window_months:
  value: 13
  type: integer
  min: 1
  confidence: U
  rules: [REC-05]
  description: "Months after execution during which the engine still proposes a fraud recall. Not in docs/context."

banking_calendar:
  value: ro
  type: enum
  choices: [ro, target2]
  confidence: U
  rules: [REC-02]
  description: "Calendar for “banking days” in recalls: Romanian business days (default) or TARGET."

same_bank_codes:
  value: [BDEM]
  type: string_list
  confidence: U
  rules: [REC-03]
  description: "IBAN bank codes treated as an internal beneficiary (BDEM = Banca Demo)."

aml_mule_score_threshold:
  value: 0.7
  type: number
  min: 0
  max: 1
  confidence: U
  rules: [URM-04]
  description: "M5 score (money mule account) at which the rules propose an STR to the analyst. The analyst decides."

aml_min_linked_victims:
  value: 2
  type: integer
  min: 1
  confidence: U
  rules: [URM-04]
  description: "Number of victims linked to the same account that, with a typology, trigger an STR proposal."

aml_prohibited_features:
  value: [varsta, age, gen, gender, sex, etnie, ethnicity, rasa, race, nationalitate, nationality,
          cetatenie, citizenship, religie, religion, stare_civila, marital_status, orientare,
          personalitate, personality, cnp]
  type: string_list
  confidence: U
  rules: [URM-01]
  description: >-
    Personal traits that AML zone scores must not use (AI Act, art. 5(1)(d)).
    The list is a proposal.

require_human_for_unfavourable:
  value: true
  type: boolean
  locked: true
  locked_code: DP_HUMAN_REVIEW_REQUIRED
  confidence: S
  rules: [DP-02]
  description: "A human signs off every adverse decision (GDPR art. 22). This cannot be turned off."

match_auto_min_points:
  value: 50
  type: integer
  min: 1
  confidence: U
  rules: [DSP-53]
  description: >-
    Points a payment needs before the intake matches it to a free-form complaint without a person (an exact
    amount is 50). Below it, or without the margin, a person picks the payment. Not in docs/context.

match_auto_min_margin:
  value: 20
  type: integer
  min: 0
  confidence: U
  rules: [DSP-53]
  description: >-
    Points the best payment needs over the next one for the intake to match it without a person. Not in docs/context.

match_candidate_min_points:
  value: 20
  type: integer
  min: 0
  confidence: U
  rules: [DSP-53]
  description: "Points a payment needs to be shown to a person as a candidate for a free-form complaint."
